name: Deploy Production

# Deploys to https://quranweb.udienz.web.id when a `v*` release tag is pushed:
#   git tag -a v2.1.0 && git push origin v2.1.0
# Only commits that are already on `master` can be released. To roll back, re-run
# this workflow for an older tag (Actions > Re-run) or press "Run workflow" and pick
# an older tag.
#
# It uses the GitHub Environment `production` (the QA_SSH_* secrets come from the
# repository). Add "Required reviewers" in Settings > Environments > production if
# you want a manual approval before each deploy.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://quranweb.udienz.web.id
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a v* tag on master
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Production deploys only from a v* tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Commit $GITHUB_SHA is not on master, release cancelled" >&2
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.QA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.QA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          # Repository (or environment) variables, not secrets: the contact is shown on the privacy page.
          PRIVACY_CONTACT_NAME: ${{ vars.PRIVACY_CONTACT_NAME }}
          PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
        run: |
          # Sent base64-encoded so no character in a name can change the ssh command line (see scripts/deploy.sh).
          name_b64="$(printf '%s' "$PRIVACY_CONTACT_NAME" | base64 -w0)"
          email_b64="$(printf '%s' "$PRIVACY_CONTACT_EMAIL" | base64 -w0)"
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.QA_SSH_PORT }}" \
            "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}" \
            "PRIVACY_CONTACT_NAME_B64=$name_b64 PRIVACY_CONTACT_EMAIL_B64=$email_b64 bash -s -- prod ${{ github.sha }}" < scripts/deploy.sh
