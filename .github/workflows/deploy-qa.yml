name: Deploy QA

# Deploys to https://quranweb-qa.udienz.web.id automatically after a push to master.
# Inactive until the repository variable QA_DEPLOY is set to "true" and the secrets
# below are filled in (Settings > Secrets and variables > Actions):
#   QA_SSH_HOST         server host or IP
#   QA_SSH_PORT         SSH port
#   QA_SSH_USER         SSH user (must be able to run `sudo docker` without a password)
#   QA_SSH_PRIVATE_KEY  deploy private key (ed25519)
#   QA_SSH_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <host>`

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to QA server
    if: ${{ vars.QA_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.QA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.QA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.QA_SSH_PORT }}" \
            "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}" \
            'bash -s' -- qa "${{ github.sha }}" < scripts/deploy.sh
