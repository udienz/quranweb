name: Deploy QA

# Deploys to https://quranweb-qa.udienz.web.id when run by hand (Actions > Deploy QA > Run workflow, or
# `gh workflow run "Deploy QA" -R udienz/quranweb --ref master`). A push to master does not deploy: the owner chooses
# when QA changes.
# Inactive until the repository variable QA_DEPLOY is set to "true" and the secrets
# below are filled in (Settings > Secrets and variables > Actions):
#   QA_SSH_HOST         server host or IP
#   QA_SSH_PORT         SSH port
#   QA_SSH_USER         SSH user (must be able to run `sudo docker` without a password)
#   QA_SSH_PRIVATE_KEY  deploy private key (ed25519)
#   QA_SSH_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <host>`

on:
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

# Least privilege for the GITHUB_TOKEN: the jobs only read the code (deploys use SSH secrets, not the token).
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to QA server
    if: ${{ vars.QA_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.QA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.QA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          # The contact is shown on the privacy page. It may be kept as a variable or as a secret: a variable
          # wins, a secret is the fallback (an empty variable is falsy, so `||` moves on to the secret).
          PRIVACY_CONTACT_NAME: ${{ vars.PRIVACY_CONTACT_NAME || secrets.PRIVACY_CONTACT_NAME }}
          PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL || secrets.PRIVACY_CONTACT_EMAIL }}
        run: |
          # Sent base64-encoded so no character in a name can change the ssh command line (see scripts/deploy.sh).
          name_b64="$(printf '%s' "$PRIVACY_CONTACT_NAME" | base64 -w0)"
          email_b64="$(printf '%s' "$PRIVACY_CONTACT_EMAIL" | base64 -w0)"
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.QA_SSH_PORT }}" \
            "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}" \
            "PRIVACY_CONTACT_NAME_B64=$name_b64 PRIVACY_CONTACT_EMAIL_B64=$email_b64 bash -s -- qa ${{ github.sha }}" < scripts/deploy.sh
