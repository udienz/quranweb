name: Deploy QA

# Deploy otomatis ke https://quranweb-qa.udienz.web.id setelah push ke master.
# Tidak aktif sampai repository variable QA_DEPLOY diset "true" dan secret
# di bawah terisi (Settings > Secrets and variables > Actions):
#   QA_SSH_HOST         host/IP server
#   QA_SSH_PORT         port SSH
#   QA_SSH_USER         user SSH (harus bisa `sudo docker` tanpa password)
#   QA_SSH_PRIVATE_KEY  private key deploy (ed25519)
#   QA_SSH_KNOWN_HOSTS  output `ssh-keyscan -p <port> <host>`

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to QA server
    if: ${{ vars.QA_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.QA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.QA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.QA_SSH_PORT }}" \
            "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}" \
            'bash -s' -- "${{ github.sha }}" < scripts/deploy-qa.sh
