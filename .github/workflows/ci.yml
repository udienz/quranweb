name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege for the GITHUB_TOKEN: the jobs only read the code (deploys use SSH secrets, not the token).
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # paths-filter needs the previous commit when this workflow runs on push.
          fetch-depth: 0

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'

  build:
    name: Lint & build (includes typecheck)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Backup and restore round trip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age rclone
          bash scripts/backup-db.test.sh
          bash scripts/deploy-contact.test.sh
          bash scripts/upload-rclone.test.sh
          bash scripts/upload-git.test.sh

      # There is no separate `tsc --noEmit` step: types such as `LayoutProps` are
      # generated by Next.js itself during the build (`.next/types/`), so a `tsc` that
      # runs before the build fails with "Cannot find name 'LayoutProps'". The
      # `next build` below already runs the full type check internally.
      - name: Build
        run: npm run build
        env:
          # Empty = the EQuran.id default.
          # Pages are rendered per request (instant = false), so this build needs no
          # access to any data source: it only checks that the code and bundle are valid.
          QURAN_API_URL: ""

  docker:
    # The image the servers build: it must start and serve its files as the runtime user (uid 1001), with the checkout's
    # permissions as strict as on the server. This was dropped once (2026-11-17) and brought back after a QA deploy failed
    # on a directory the runtime user could not read (PR #71).
    name: Docker image starts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and smoke test
        run: bash scripts/docker-smoke.sh
        env:
          STRICT_PERMISSIONS: "1"

  e2e:
    # Browser tests (e2e/*.e2e.ts) against the production build, with the small data copy in e2e/fixtures: audio across pages and surahs, data saver, the fallback server, keyboard, lock screen, memorization, the reciter list, 404s and the manifest. Every .mp3 is answered with a short WAV, so no network is needed.
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
