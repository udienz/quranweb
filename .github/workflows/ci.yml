name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Kosong = fallback ke live instance resmi gadingnst/quran-api.
          # Halaman di-render per-request (instant = false), jadi build ini
          # tidak butuh akses ke API sama sekali — hanya memverifikasi
          # kode/bundle valid.
          QURAN_API_URL: ""
