name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. Please do not paste personal data, and report a **security** problem privately (see the link in the issue chooser).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: The page address
      description: For example https://quranweb.udienz.web.id/surah/2
  - type: input
    id: device
    attributes:
      label: Browser and device
      description: For example Chrome on Android, or Safari on an iPhone.
