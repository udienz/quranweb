name: Feature idea
description: Something you would like QuranWeb to do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How you would use it
      description: Who would use it, and when? A real situation helps more than a description of the feature.
