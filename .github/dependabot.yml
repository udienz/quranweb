# Update pull requests from Dependabot (security alerts are separate and on in the repository settings).
# Minor and patch updates are grouped into one pull request per ecosystem, so they do not arrive as many small pull
# requests that conflict in package-lock.json; a major update comes on its own, because it may need code changes
# (read the release notes, CI must pass).
# Nothing is ignored or closed: every proposed update is checked, and one that is not safe yet stays open until it is.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The node base image of the Dockerfile. A Node major is a planned move to the next LTS (see CLAUDE.md), but the
  # pull request is still proposed so it is not missed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    commit-message:
      prefix: "docker"
